<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>物體框標註</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d1d1b;--mut:#6b675e;--card:#fff;--line:#d9d4c7;--acc:#1f4e79;--ok:#0a7d5a}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--ink:#ecebe6;--mut:#a09c90;--card:#1f1f1c;--line:#3a3935;--acc:#7fb4e6;--ok:#34c79a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Noto Sans CJK TC",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}.bar{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
main{max-width:1180px;margin:0 auto;padding:14px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}@media(max-width:800px){.imgs{grid-template-columns:1fr}}
.imgs figure{margin:0}.imgs img{width:100%;height:auto;border-radius:6px;display:block}.imgs figcaption{color:var(--mut);font-size:13px;text-align:center;margin-top:4px}
.btns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}@media(max-width:800px){.btns{grid-template-columns:1fr}}
button{font:inherit;padding:10px 6px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
button b{display:block;font-size:17px}button small{color:inherit;opacity:.8}
input[type=text],textarea{width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.nav{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}.nav button{padding:8px 14px;text-align:center}
#code{width:90px;margin:0}small{color:var(--mut)}kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
</style></head><body>
<header><h1>物體框標註</h1><div class="bar"><i id="prog"></i></div><span id="count"></span>
<label>代號 <input id="code" type="text" placeholder="例如 A1"></label><button id="exp">匯出 CSV</button></header>
<main><section class="card">
<div class="imgs"><figure><img id="full" alt="整張圖"><figcaption>整張圖</figcaption></figure><figure><img id="crop" alt="局部放大"><figcaption>局部放大</figcaption></figure></div>
<p><b>紅框裡是什麼？</b> <small>快捷鍵 <kbd>1</kbd>–<kbd>5</kbd>；選 1、2、3 後請填寫名稱再按 <kbd>Enter</kbd> 跳下一題；<kbd>←</kbd> <kbd>→</kbd> 換題，<kbd>u</kbd> 跳到下一個未標題。</small></p>
<div class="btns" id="btns"></div>
<input id="word" type="text" placeholder="問題 2：用一到兩個詞寫出紅框裡的東西（選 1、2、3 時必填）">
<textarea id="note" rows="2" placeholder="備註（選填）"></textarea>
<div class="nav"><button id="prev">← 上一題</button><button id="next">下一題 →</button><button id="unl">下一個未標 (u)</button><span id="pos"></span></div>
</section></main>
<script>
const ITEMS=__ITEMS__;
const OPTS=[["1","一個物體（含被切到或被擋住）","框住單一物體；被切到或被擋住時，框住所有看得見的部分"],["2","只框到一部分／明顯偏離","看得見的部分裡的一小塊，或大很多，或位置偏掉"],["3","框住一群或多個物體","整群、一排、兩個以上"],["4","沒有明確的物體","背景、地面、牆、天空、空白"],["5","無法判斷","太模糊、太小、太暗"]];
const KEY="laod_blind_v1";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let i=0;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
$("btns").innerHTML=OPTS.map(o=>`<button data-v="${o[0]}"><b>${o[0]}</b>${o[1]}<br><small>${o[2]}</small></button>`).join("");
$("code").value=st._code||"";$("code").oninput=e=>{st._code=e.target.value.trim();save()};
const done=c=>{const s=st[c.id]||{};return s.v&&(s.v>3||(s.word||"").trim())};
function show(){const c=ITEMS[i],s=st[c.id]||{};$("full").src="img/"+c.id+"_full.jpg";$("crop").src="img/"+c.id+"_crop.jpg";
$("word").value=s.word||"";$("note").value=s.note||"";document.querySelectorAll("#btns button").forEach(b=>b.classList.toggle("sel",+b.dataset.v===s.v));
const n=ITEMS.filter(done).length;$("count").textContent=n+" / "+ITEMS.length;$("prog").style.width=(100*n/ITEMS.length)+"%";$("pos").textContent=(i+1)+" / "+ITEMS.length}
function set(v){const c=ITEMS[i];st[c.id]=Object.assign(st[c.id]||{},{v});if(v>3)st[c.id].word=st[c.id].word||"";save();show();if(v<=3)$("word").focus();else if(i<ITEMS.length-1){i++;show()}}
function go(d){i=Math.min(ITEMS.length-1,Math.max(0,i+d));show()}
function nextUn(){for(let k=1;k<=ITEMS.length;k++){const j=(i+k)%ITEMS.length;if(!done(ITEMS[j])){i=j;show();return}}}
document.querySelectorAll("#btns button").forEach(b=>b.onclick=()=>set(+b.dataset.v));
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("unl").onclick=nextUn;
$("word").oninput=e=>{const c=ITEMS[i];st[c.id]=Object.assign(st[c.id]||{},{word:e.target.value});save();show2()};
$("word").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(done(ITEMS[i])){$("word").blur();if(i<ITEMS.length-1){i++;show()}}}};
$("note").oninput=e=>{const c=ITEMS[i];st[c.id]=Object.assign(st[c.id]||{},{note:e.target.value});save()};
function show2(){const n=ITEMS.filter(done).length;$("count").textContent=n+" / "+ITEMS.length;$("prog").style.width=(100*n/ITEMS.length)+"%"}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(e.target.tagName))return;
if("12345".includes(e.key)&&e.key)set(+e.key);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);else if(e.key==="u")nextUn()});
$("exp").onclick=()=>{const miss=ITEMS.filter(c=>!done(c)).length;if(miss&&!confirm("還有 "+miss+" 題未完成（含選 1–3 但未填名稱）。仍要匯出？"))return;
const code=(st._code||"unknown").replace(/[^A-Za-z0-9_-]/g,"");const names={1:"complete",2:"part_or_off",3:"group",4:"no_object",5:"cannot_tell"};
const rows=["id,choice,choice_name,word,note"].concat(ITEMS.map(c=>{const s=st[c.id]||{};return [c.id,s.v||"",names[s.v]||"",JSON.stringify(s.word||""),JSON.stringify(s.note||"")].join(",")}));
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+rows.join("\n")],{type:"text/csv"}));a.download="blind_labels_"+code+".csv";a.click()};
show();
</script></body></html>
